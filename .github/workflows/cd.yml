name: API CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, openssl, tokenizer, xml, ctype, json, bcmath

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend build dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Create deployment archive
        run: |
          zip -r release.zip . \
            -x "**/.git*" \
               "**/.github/**" \
               "**/node_modules/**" \
               "**/tests/**" \
               "**/phpunit.xml" \
               "**/.env" \
               "**/.env.example" \
               "**/storage/logs/**" \
               "**/storage/framework/cache/**" \
               "**/storage/framework/sessions/**" \
               "**/storage/framework/views/**"

      - name: Upload release archive via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          source: "release.zip"
          target: "/home2/jayteemi/public_html/scotty-api"
          use_insecure_cipher: true

      - name: Decompress and deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          use_insecure_cipher: true
          script: |
            set -euo pipefail
            DEPLOY_DIR="/home2/jayteemi/public_html/scotty-api"
            ARCHIVE="$DEPLOY_DIR/release.zip"

            echo "Verifying archive at: $ARCHIVE"
            ls -lh "$ARCHIVE"

            echo "Extracting in place..."
            unzip -oq "$ARCHIVE" -d "$DEPLOY_DIR"
            rm -f "$ARCHIVE"
            cd "$DEPLOY_DIR"

            echo "Preparing Laravel runtime directories and permissions..."
            mkdir -p storage/logs
            mkdir -p storage/framework/cache/data
            mkdir -p storage/framework/sessions
            mkdir -p storage/framework/views
            mkdir -p bootstrap/cache
            chmod -R ug+rwX storage bootstrap/cache || true

            if [ -f artisan ]; then
              echo "Clearing stale Laravel caches..."
              php artisan optimize:clear || true

              if [ -f .env ]; then
                echo "Rebuilding Laravel caches..."
                php artisan config:cache || true
                php artisan route:cache || true
                php artisan view:cache || true
              else
                echo "No .env found, skipping config/route/view cache rebuild."
              fi
            fi

            echo "Running health checks..."
            curl -fsS -o /dev/null -m 20 "http://api.scottysays.autos/api" || true
            curl -fsS -o /dev/null -m 20 "http://api.scottysays.autos/swagger" || true

            if [ -f storage/logs/laravel.log ]; then
              echo "Recent Laravel log entries:"
              tail -n 120 storage/logs/laravel.log || true
            fi

            echo "Deployment complete. Contents:"
            ls "$DEPLOY_DIR" | head -20
