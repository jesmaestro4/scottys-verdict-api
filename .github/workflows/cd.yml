name: API CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, openssl, tokenizer, xml, ctype, json, bcmath

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend build dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Create deployment archive
        run: |
          zip -r release.zip . \
            -x "**/.git*" \
               "**/.github/**" \
               "**/node_modules/**" \
               "**/tests/**" \
               "**/phpunit.xml" \
               "**/.env" \
               "**/.env.example" \
               "**/storage/logs/**" \
               "**/storage/framework/cache/**" \
               "**/storage/framework/sessions/**" \
               "**/storage/framework/views/**"

      - name: Export GitHub Environment variables
        env:
          VARS_JSON: ${{ toJson(vars) }}
        run: |
          printf '%s' "$VARS_JSON" \
            | jq -r 'to_entries[] | "\(.key)=\(.value|tostring|gsub("\n";"\\n"))"' \
            > runtime.vars.env

          echo "Exported $(wc -l < runtime.vars.env) non-secret environment vars"

      - name: Upload release archive via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          source: "release.zip,runtime.vars.env"
          target: "/home2/jayteemi/public_html/scotty-api"
          use_insecure_cipher: true

      - name: Decompress and deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          use_insecure_cipher: true
          script: |
            set -euo pipefail
            DEPLOY_DIR="/home2/jayteemi/public_html/scotty-api"
            ARCHIVE="$DEPLOY_DIR/release.zip"
            VARS_FILE="$DEPLOY_DIR/runtime.vars.env"
            ENV_FILE="$DEPLOY_DIR/.env"

            echo "Verifying archive at: $ARCHIVE"
            ls -lh "$ARCHIVE"

            echo "Extracting in place..."
            unzip -oq "$ARCHIVE" -d "$DEPLOY_DIR"
            rm -f "$ARCHIVE"

            if [ ! -f "$ENV_FILE" ]; then
              cp "$DEPLOY_DIR/.env.example" "$ENV_FILE"
            fi

            if [ -f "$VARS_FILE" ]; then
              awk -F= '
                BEGIN {
                  while ((getline line < envf) > 0) {
                    if (line ~ /^[A-Za-z_][A-Za-z0-9_]*=/) {
                      split(line, kv, "=")
                      existing[kv[1]] = line
                    }
                  }
                  close(envf)
                }
                {
                  if ($0 ~ /^[A-Za-z_][A-Za-z0-9_]*=/) {
                    key=$1
                    if (key != "APP_KEY") {
                      existing[key]=$0
                    }
                  }
                }
                END {
                  for (k in existing) {
                    print existing[k]
                  }
                }
              ' envf="$ENV_FILE" "$VARS_FILE" > "$ENV_FILE.tmp"

              mv "$ENV_FILE.tmp" "$ENV_FILE"
              rm -f "$VARS_FILE"
            fi

            cd "$DEPLOY_DIR"
            php artisan config:clear --no-interaction || true
            echo "Deployment complete. Contents:"
            ls "$DEPLOY_DIR" | head -20
