name: API CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, openssl, tokenizer, xml, ctype, json, bcmath

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend build dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Create deployment archive
        run: |
          zip -r release.zip . \
            -x "**/.git*" \
               "**/.github/**" \
               "**/node_modules/**" \
               "**/tests/**" \
               "**/phpunit.xml" \
               "**/.env" \
               "**/.env.example" \
               "**/storage/logs/**" \
               "**/storage/framework/cache/**" \
               "**/storage/framework/sessions/**" \
               "**/storage/framework/views/**"

      - name: Upload release archive via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          source: "release.zip"
          target: "/home2/jayteemi/public_html/scotty-api"
          use_insecure_cipher: true

      - name: Decompress and deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          use_insecure_cipher: true
          script: |
            set -euo pipefail
            DEPLOY_DIR="/home2/jayteemi/public_html/scotty-api"
            ARCHIVE="$DEPLOY_DIR/release.zip"

            echo "Verifying archive at: $ARCHIVE"
            ls -lh "$ARCHIVE"

            echo "Extracting in place..."
            unzip -oq "$ARCHIVE" -d "$DEPLOY_DIR"
            rm -f "$ARCHIVE"

            cd "$DEPLOY_DIR"

            # Bootstrap runtime env only when first deploy (or key is missing).
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            if ! grep -q '^APP_KEY=base64:' .env; then
              php artisan key:generate --force --no-interaction
            fi

            php artisan config:clear --no-interaction
            echo "Deployment complete. Contents:"
            ls "$DEPLOY_DIR" | head -20
