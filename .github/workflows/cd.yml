name: API CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, dom, curl, fileinfo, openssl, tokenizer, xml, ctype, json, bcmath

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend build dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Create deployment archive
        run: |
          mkdir -p .deploy
          zip -r .deploy/release.zip . \
            -x "**/.git*" \
               "**/.github/**" \
               "**/node_modules/**" \
               "**/tests/**" \
               "**/phpunit.xml" \
               "**/.env" \
               "**/.env.example" \
               "**/storage/logs/**" \
               "**/storage/framework/cache/**" \
               "**/storage/framework/sessions/**" \
               "**/storage/framework/views/**"

      - name: Upload release archive via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          source: ".deploy/release.zip"
          target: "/tmp"
          use_insecure_cipher: true

      - name: Decompress and deploy on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_DEPLOY_PATH: ${{ vars.API_DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          use_insecure_cipher: true
          envs: API_DEPLOY_PATH
          script: |
            set -euo pipefail
            DEPLOY_PATH="${API_DEPLOY_PATH:-/scotty-api}"
            ARCHIVE_PATH="/tmp/.deploy/release.zip"

            echo "Looking for archive at: $ARCHIVE_PATH"
            ls -la /tmp/ | head -20

            if [ ! -f "$ARCHIVE_PATH" ]; then
              echo "ERROR: Release archive not found at $ARCHIVE_PATH"
              exit 1
            fi

            echo "Archive found. Checking for unzip..."
            if ! command -v unzip >/dev/null 2>&1; then
              echo "ERROR: unzip is not installed on the server"
              exit 1
            fi

            echo "Deploying to: $DEPLOY_PATH"
            mkdir -p "$DEPLOY_PATH"
            unzip -oq "$ARCHIVE_PATH" -d "$DEPLOY_PATH"
            rm -f "$ARCHIVE_PATH"
            echo "Deployment complete"
